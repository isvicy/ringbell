---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: reports
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: reports-secret
    creationPolicy: Owner
  data:
    - secretKey: api-token
      remoteRef:
        key: reports
        property: api-token
